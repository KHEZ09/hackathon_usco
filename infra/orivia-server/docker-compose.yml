name: orivia-server

services:
  api:
    build:
      context: ../../backend
    env_file:
      - .env
    environment:
      ORIVIA_ENV: production
      ORIVIA_HOST: 0.0.0.0
      ORIVIA_PORT: 8000
      ORIVIA_BLOCKCHAIN_BACKEND: ${ORIVIA_BLOCKCHAIN_BACKEND:-postgres}
      ORIVIA_BLOCKCHAIN_RPC_URL: ${ORIVIA_BLOCKCHAIN_RPC_URL:-}
      ORIVIA_BLOCKCHAIN_PRIVATE_KEY: ${ORIVIA_BLOCKCHAIN_PRIVATE_KEY:-}
      ORIVIA_BLOCKCHAIN_CONTRACT_ADDRESS: ${ORIVIA_BLOCKCHAIN_CONTRACT_ADDRESS:-}
      ORIVIA_BLOCKCHAIN_CHAIN_ID: ${ORIVIA_BLOCKCHAIN_CHAIN_ID:-80002}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      # Este stack es el staging de la hackatón; solo publica perfiles sintéticos
      # y evidencia técnica, nunca secretos, hashes de contraseña o tokens.
      ORIVIA_PUBLIC_LIVE_INCLUDE_DEMO_DATA: ${ORIVIA_PUBLIC_LIVE_INCLUDE_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - orivia_private

  web:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public-live:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - orivia_private

  frontend:
    build:
      context: ../../frontend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_ORIVIA_API_URL: https://oriviaurlapi.tobaru.xyz/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - orivia_private

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/orivia-server/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/orivia-server/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/orivia-server/.env}
    volumes:
      - orivia_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orivia_private

networks:
  orivia_private:
    driver: bridge

volumes:
  orivia_postgres_data:
  caddy_data:
  caddy_config:
