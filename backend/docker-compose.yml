services:
  api:
    build: .
    env_file:
      - .env
    environment:
      ORIVIA_DATABASE_URL: postgresql://orivia:orivia_dev_password@postgres:5432/orivia
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orivia_private

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orivia
      POSTGRES_USER: orivia
      POSTGRES_PASSWORD: orivia_dev_password
    volumes:
      - orivia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orivia -d orivia"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orivia_private

networks:
  orivia_private:
    driver: bridge

volumes:
  orivia_postgres_data:
